name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  front:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build --outDir "$RUNNER_TEMP/front-build"

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: croilab_test
          MARIADB_USER: ct
          MARIADB_PASSWORD: ctpass
          MARIADB_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, openssl
          coverage: none
      - run: composer install --no-interaction --no-progress
      - name: Sintaxis de todo el PHP
        run: find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Tests (unitarios + integración contra MariaDB)
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_NAME: croilab_test
          TEST_DB_USER: ct
          TEST_DB_PASS: ctpass
        run: vendor/bin/phpunit
