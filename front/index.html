<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tareas - ERP Croilab</title>
    <!-- Antes de pintar nada: pone el tema guardado para que el modo oscuro no
         parpadee en blanco al cargar. Misma clave que useTema (croilab:tema). -->
    <script>
      try {
        if (localStorage.getItem('croilab:tema') === 'dark') document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
